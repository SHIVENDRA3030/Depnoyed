apiVersion: depnoyed/v1
name: markdown-wiki
display:
  name: "Markdown Wiki"
  category: "Productivity"
  description: "A simple markdown-based wiki with file-based storage. Edit pages directly in the browser."
runtime:
  type: "container"
  image: "traefik/whoami:latest"
  port: 80
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "2Gi"
health:
  http:
    path: "/"
    port: 80