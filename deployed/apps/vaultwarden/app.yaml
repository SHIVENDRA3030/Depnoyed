apiVersion: depnoyed/v1
name: vaultwarden
display:
  name: "Vaultwarden"
  category: "Security"
  description: "Unofficial Bitwarden compatible server. Store your passwords securely."
runtime:
  type: "container"
  image: "vaultwarden/server:latest"
  port: 80
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "2Gi"
health:
  http:
    path: "/alive"
    port: 80