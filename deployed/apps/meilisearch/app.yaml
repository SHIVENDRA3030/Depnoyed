apiVersion: depnoyed/v1
name: meilisearch
display:
  name: "Meilisearch"
  category: "Database"
  description: "Lightning-fast, typo-tolerant search engine with a REST API — instant, relevant full-text search out of the box."
runtime:
  type: "container"
  image: "getmeili/meilisearch:latest"
  port: 7700
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "meilisearch-data"
    mountPath: "/meili_data"
    size: "1Gi"
health:
  http:
    path: "/health"
    port: 7700
