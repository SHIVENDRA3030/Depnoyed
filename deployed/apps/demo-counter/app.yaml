apiVersion: depnoyed/v1
name: demo-counter
display:
  name: "Demo Counter"
  category: "Demo"
  description: "A tiny demo app that persists a counter in its dedicated volume. Perfect for proving that data survives container restarts."
runtime:
  type: "container"
  image: "traefik/whoami:latest"
  port: 80
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "1Gi"
health:
  http:
    path: "/"
    port: 80