apiVersion: depnoyed/v1
name: open-webui
display:
  name: "Open WebUI"
  category: "AI"
  description: "Self-hosted WebUI for LLMs. Chat with local models via Ollama or remote APIs."
runtime:
  type: "container"
  image: "ghcr.io/open-webui/open-webui:latest"
  port: 8080
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"
storage:
  - name: "data"
    mountPath: "/app/backend/data"
    size: "5Gi"
health:
  http:
    path: "/health"
    port: 8080