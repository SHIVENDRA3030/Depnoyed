apiVersion: depnoyed/v1
name: uptime-kuma
display:
  name: "Uptime Kuma"
  category: "Monitoring"
  description: "Self-hosted monitoring tool with a fancy, easy to use UI — uptime checks for HTTP(s), TCP, ping, DNS and more."
runtime:
  type: "container"
  image: "louislam/uptime-kuma:1"
  port: 3001
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "uptime-kuma-data"
    mountPath: "/app/data"
    size: "1Gi"
health:
  http:
    path: "/"
    port: 3001
