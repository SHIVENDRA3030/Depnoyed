apiVersion: depnoyed/v1
name: mongodb
display:
  name: "MongoDB"
  category: "Database"
  description: "A document database with the scalability and flexibility that you want with the querying and indexing that you need."
runtime:
  type: "container"
  image: "mongo:7"
  port: 27017
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "data"
    mountPath: "/data/db"
    size: "10Gi"
health:
  tcp:
    port: 27017