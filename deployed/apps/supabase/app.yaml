apiVersion: depnoyed/v1
name: supabase
display:
  name: "Supabase Studio"
  category: "Database"
  description: "The open source Firebase alternative — Studio dashboard UI."
runtime:
  type: "container"
  image: "supabase/studio:latest"
  port: 3000
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "1Gi"
health:
  http:
    path: "/"
    port: 3000
