apiVersion: depnoyed/v1
name: ollama
display:
  name: "Ollama"
  category: "AI"
  description: "Run LLMs locally. Get up and running with Llama 3, Mistral, and other models."
runtime:
  type: "container"
  image: "ollama/ollama:latest"
  port: 11434
resources:
  requests:
    cpu: "1000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "16Gi"
storage:
  - name: "data"
    mountPath: "/root/.ollama"
    size: "20Gi"
health:
  http:
    path: "/"
    port: 11434