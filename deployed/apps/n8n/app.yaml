apiVersion: depnoyed/v1

name: n8n
version: 1.0.0

display:
  name: n8n
  category: Automation
  description: Free and open node based Workflow Automation Tool. Easily automate tasks across different services.

runtime:
  type: kubernetes
  image: n8nio/n8n:latest
  port: 5678

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

storage:
  - name: data
    mountPath: /home/node/.n8n
    size: 5Gi

health:
  http:
    path: /
    port: 5678
