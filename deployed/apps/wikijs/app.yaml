apiVersion: depnoyed/v1
name: wikijs
display:
  name: "Wiki.js"
  category: "Productivity"
  description: "The most powerful, extensible, and beautiful wiki software. Built on Node.js."
runtime:
  type: "container"
  image: "requarks/wiki:latest"
  port: 3000
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "data"
    mountPath: "/wiki/data"
    size: "5Gi"
  - name: "db"
    mountPath: "/wiki/db"
    size: "2Gi"
health:
  http:
    path: "/"
    port: 3000