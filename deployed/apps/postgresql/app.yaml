apiVersion: depnoyed/v1
name: postgresql
display:
  name: "PostgreSQL"
  category: "Database"
  description: "A powerful, open-source object-relational database system with over 35 years of active development."
runtime:
  type: "container"
  image: "postgres:16-alpine"
  port: 5432
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"
storage:
  - name: "data"
    mountPath: "/var/lib/postgresql/data"
    size: "10Gi"
health:
  tcp:
    port: 5432