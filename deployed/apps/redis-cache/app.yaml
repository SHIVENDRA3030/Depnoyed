apiVersion: depnoyed/v1
name: redis-cache
display:
  name: "Redis Cache"
  category: "Database"
  description: "An in-memory data structure store used as a database, cache, and message broker."
runtime:
  type: "container"
  image: "redis:7-alpine"
  port: 6379
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "2Gi"
health:
  tcp:
    port: 6379