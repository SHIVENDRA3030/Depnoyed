apiVersion: depnoyed/v1
name: gitea-lite
display:
  name: "Gitea Lite"
  category: "Developer Tools"
  description: "A lightweight self-hosted Git service. Perfect for personal projects and small teams."
runtime:
  type: "container"
  image: "gitea/gitea:latest"
  port: 3000
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
storage:
  - name: "data"
    mountPath: "/data"
    size: "5Gi"
health:
  http:
    path: "/"
    port: 3000