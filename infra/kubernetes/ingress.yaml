apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: depnoyed
  namespace: depnoyed-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - dashboard.${DEPLOY_BASE_DOMAIN}
        - ${DEPLOY_BASE_DOMAIN}
      secretName: depnoyed-tls
  rules:
    - host: dashboard.${DEPLOY_BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: depnoyed
                port:
                  number: 80
    - host: ${DEPLOY_BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: depnoyed
                port:
                  number: 80
